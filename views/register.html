
<style>
* {
    box-sizing: border-box;
}

.register-container {
    max-width: 480px;
    width: 92%;
    margin: 35px auto;
    padding: 35px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(16, 25, 35, 0.10);
}

.register-logo {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    color: #20364b;
    margin-bottom: 25px;
}

.register-logo span {
    color: #e63946;
}

.register-container h2 {
    text-align: center;
    color: #20364b;
    margin-bottom: 8px;
}

.register-subtitle {
    text-align: center;
    color: #718096;
    font-size: 14px;
    margin-bottom: 28px;
}

.register-container label {
    display: block;
    margin: 15px 0 7px;
    font-size: 14px;
    font-weight: bold;
    color: #263445;
}

.register-container input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5dce5;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.register-container input:focus {
    border-color: #20364b;
    box-shadow: 0 0 0 3px #20364b15;
}

.register-button {
    width: 100%;
    padding: 14px;
    margin-top: 24px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.register-button:hover {
    background: #c92d3a;
}

.register-footer {
    text-align: center;
    color: #718096;
    font-size: 14px;
    margin-top: 22px;
}

.register-footer a {
    color: #e63946;
    font-weight: bold;
    text-decoration: none;
}

@media (max-width: 480px) {
    .register-container {
        padding: 24px;
    }
}
</style>

<div class="register-container">
    <div class="register-logo">⚙ AUTODIJELOVI <span>MEB</span></div>

    <h2>Kreiraj svoj račun</h2>
    <p class="register-subtitle">Registruj se i pronađi dijelove za svoje vozilo.</p>

    <form id="register-form">
        <label for="name">Ime i prezime</label>
        <input type="text" id="name" placeholder="Unesite ime i prezime" required>

        <label for="email">Email adresa</label>
        <input type="email" id="email" placeholder="Unesite email adresu" required>

        <label for="password">Lozinka</label>
        <input type="password" id="password" placeholder="Kreirajte lozinku" required>

        <label for="confirm">Potvrdite lozinku</label>
        <input type="password" id="confirm" placeholder="Ponovite lozinku" required>

        <button type="submit" class="register-button">Kreiraj račun</button>
        <p class="message"></p>
    </form>

    <div class="register-footer">
        Već imate račun? <a href="#login">Prijavite se</a>
    </div>
</div>
