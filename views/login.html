 
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - Auto Dijelovi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            color: #263445;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #20364b;
            margin-bottom: 10px;
        }

        .logo span {
            color: #e63946;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #20364b;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d5dce5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #20364b;
            box-shadow: 0 0 0 3px rgba(32, 54, 75, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #c92d3a;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #718096;
        }

        .register-link a {
            color: #e63946;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 30px auto;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">⚙ AUTODIJELOVI <span>MEB</span></div>

        <h2>Dobro došli!</h2>
        <p class="subtitle">Prijavite se na svoj korisnički račun.</p>

        <form id="login-form">
            <label for="email">Email adresa</label>
            <input
                type="email"
                id="email"
                placeholder="Unesite email adresu"
                required
            >

            <label for="password">Lozinka</label>
            <input
                type="password"
                id="password"
                placeholder="Unesite lozinku"
                required
            >

            <button type="submit" class="login-button">Prijavi se</button>

            <p class="message"></p>
        </form>

        <div class="register-link">
            Nemate račun? <a href="#register">Registrujte se</a>
        </div>

    </div>

</body>
</html>
